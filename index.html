<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stick Fight Arena</title>
<style>
  :root{
    --bg1:#0e1b16; --bg2:#12261d; --accent:#7ee787; --accent2:#f2c14e;
    --p1:#e5484d; --p2:#3b9eff; --p3:#4caf50; --p4:#f2c14e;
    --panel:#16241d; --panel-border:#264034; --text:#eafff0; --muted:#8fb39c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    background:linear-gradient(180deg,var(--bg1),var(--bg2));
    font-family:'Segoe UI',Roboto,Arial,sans-serif; color:var(--text);}
  #app{position:fixed;inset:0;}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center;}
  .hidden{display:none !important;}

  /* START SCREEN */
  #startIcon{width:180px;height:auto;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5));animation:float 3s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  h1.title{font-size:2.4em;margin:0;letter-spacing:2px;color:var(--accent);text-shadow:0 2px 12px rgba(126,231,135,.4);}
  p.subtitle{color:var(--muted);margin:0 0 10px;font-size:.95em;}

  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:16px;padding:24px;width:min(360px,88vw);box-shadow:0 8px 30px rgba(0,0,0,.4);}
  input[type=text]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--panel-border);background:#0e1a14;color:var(--text);font-size:1.1em;text-align:center;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;}
  input[type=text]::placeholder{color:#4f6b5c;letter-spacing:normal;}
  button{cursor:pointer;border:none;border-radius:10px;padding:13px 18px;font-size:1em;font-weight:600;transition:transform .1s, filter .15s;}
  button:active{transform:scale(.96);}
  .btn-main{background:linear-gradient(135deg,var(--accent),#4fbf6b);color:#0a1a10;width:100%;margin-top:4px;}
  .btn-main:hover{filter:brightness(1.08);}
  .btn-secondary{background:#20342a;color:var(--text);border:1px solid var(--panel-border);width:100%;}
  .btn-secondary:hover{filter:brightness(1.2);}
  .row{display:flex;gap:10px;width:100%;}
  .divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8em;margin:14px 0;width:100%;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--panel-border);}

  /* LOBBY */
  .room-code{font-size:2.2em;letter-spacing:8px;font-weight:700;color:var(--accent2);background:#0e1a14;border-radius:12px;padding:10px 18px;border:1px dashed var(--panel-border);}
  .players-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin:14px 0;}
  .player-slot{background:#0e1a14;border-radius:12px;padding:14px 8px;border:2px solid var(--panel-border);display:flex;flex-direction:column;align-items:center;gap:6px;min-height:80px;justify-content:center;}
  .player-slot.filled{border-color:var(--accent);}
  .player-slot .dot{width:22px;height:22px;border-radius:50%;}
  .player-slot .name{font-size:.85em;font-weight:600;}
  .player-slot .tag{font-size:.65em;color:var(--muted);}
  .status-line{color:var(--muted);font-size:.9em;min-height:20px;}

  /* GAME */
  #gameScreen{padding:0;}
  #canvasWrap{position:relative;width:100%;height:100%;}
  canvas{display:block;background:transparent;width:100%;height:100%;}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:10px;pointer-events:none;gap:6px;flex-wrap:wrap;}
  .hp-card{background:rgba(14,26,20,.75);border:1px solid var(--panel-border);border-radius:10px;padding:6px 10px;min-width:100px;backdrop-filter:blur(2px);}
  .hp-card .nm{font-size:.7em;font-weight:700;margin-bottom:3px;display:flex;justify-content:space-between;}
  .hp-bar{height:8px;border-radius:4px;background:#28382f;overflow:hidden;}
  .hp-fill{height:100%;background:linear-gradient(90deg,#7ee787,#3ecf5e);transition:width .15s;}
  #banner{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(14,26,20,.8);border:1px solid var(--panel-border);border-radius:10px;padding:6px 16px;font-size:.85em;color:var(--accent2);pointer-events:none;}
  #winOverlay{position:absolute;inset:0;background:rgba(6,12,9,.88);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
  #winOverlay.show{display:flex;}
  #winOverlay h2{font-size:2em;color:var(--accent2);margin:0;}

  /* TOUCH CONTROLS */
  #touchControls{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;padding:16px;pointer-events:none;}
  #touchControls .pad{display:flex;gap:10px;pointer-events:auto;}
  .tbtn{width:58px;height:58px;border-radius:50%;background:rgba(126,231,135,.18);border:1px solid rgba(126,231,135,.5);color:var(--text);font-size:1.3em;display:flex;align-items:center;justify-content:center;user-select:none;}
  .tbtn:active{background:rgba(126,231,135,.4);}
  .tbtn.attack{background:rgba(229,72,77,.25);border-color:rgba(229,72,77,.6);}
  .tbtn.fire{background:rgba(242,193,78,.25);border-color:rgba(242,193,78,.6);}
  .tbtn.jump{background:rgba(59,158,255,.25);border-color:rgba(59,158,255,.6);}

  .link{color:var(--accent);cursor:pointer;text-decoration:underline;font-size:.85em;}
  .small{font-size:.75em;color:var(--muted);}
  #copyMsg{font-size:.75em;color:var(--accent);height:14px;}
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* =========================================================
   STICK FIGHT ARENA — juego multijugador simple con Firebase
   - Host (jugador 1) crea la sala y arbitra la física del juego
   - Hasta 4 jugadores. Los clientes envían su input al host,
     el host simula y publica el estado del mundo.
   ========================================================= */

// ---------- FIREBASE ----------
const firebaseConfig = {
  apiKey: "AIzaSyBQbQCtPDe9eQm6KsOiVzEqhi00KwtHp4E",
  authDomain: "ragdoll-9a55f.firebaseapp.com",
  databaseURL: "https://ragdoll-9a55f-default-rtdb.firebaseio.com",
  projectId: "ragdoll-9a55f",
  storageBucket: "ragdoll-9a55f.firebasestorage.app",
  messagingSenderId: "745820841720",
  appId: "1:745820841720:web:432c2a78e5220282dd7d0d"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ---------- ESTADO GLOBAL ----------
const COLORS = ['#e5484d','#3b9eff','#4caf50','#f2c14e'];
const COLOR_NAMES = ['Rojo','Azul','Verde','Amarillo'];
const MAX_PLAYERS = 4;

let myId = localStorage.getItem('sf_uid');
if(!myId){ myId = 'u'+Math.random().toString(36).slice(2,10); localStorage.setItem('sf_uid', myId); }

let state = {
  roomCode: null,
  isHost: false,
  playerName: '',
  playerIndex: -1,
  players: {},        // snapshot from DB
  roomRef: null,
  world: null,         // local authoritative sim (host only)
  status: 'idle'
};

// ---------- UI HELPERS ----------
const $ = id => document.getElementById(id);
function show(id){ ['startScreen','lobbyScreen','gameScreen'].forEach(s=>$(s).classList.toggle('hidden', s!==id)); }

// ---------- START SCREEN ----------
function friendlyFirebaseError(err){
  const code = err && err.code ? err.code : '';
  if(code === 'PERMISSION_DENIED'){
    return 'Firebase rechazó la conexión (permisos). Revisá las reglas de tu Realtime Database (ver instrucciones abajo del juego).';
  }
  if(err && /network/i.test(err.message||'')){
    return 'No se pudo conectar a Firebase. Revisá tu conexión a internet.';
  }
  return 'Error: ' + (err && err.message ? err.message : String(err));
}
function setButtonsBusy(busy){
  $('btnCreate').disabled = busy; $('btnJoin').disabled = busy;
  $('btnCreate').style.opacity = busy ? .6 : 1; $('btnJoin').style.opacity = busy ? .6 : 1;
}

$('btnCreate').onclick = async () => {
  const name = ($('nameInput').value || 'Jugador').trim().slice(0,12);
  if(!name){ $('startStatus').textContent='Ingresá tu nombre'; return; }
  $('startStatus').textContent = 'Creando sala…';
  setButtonsBusy(true);
  try{
    state.playerName = name;
    const code = Math.floor(1000 + Math.random()*9000).toString();
    state.roomCode = code;
    state.isHost = true;
    state.playerIndex = 0;
    state.roomRef = db.ref('rooms/'+code);

    await state.roomRef.set({
      status: 'waiting',
      hostId: myId,
      createdAt: Date.now(),
      players: {
        [myId]: { name, index:0, color: COLORS[0], ready:true, joinedAt: Date.now() }
      }
    });
    state.roomRef.child('players/'+myId).onDisconnect().remove();
    $('startStatus').textContent = '';
    enterLobby();
  } catch(err){
    console.error('Error al crear sala:', err);
    $('startStatus').textContent = friendlyFirebaseError(err);
  } finally {
    setButtonsBusy(false);
  }
};

$('btnJoin').onclick = async () => {
  const name = ($('nameInput').value || 'Jugador').trim().slice(0,12);
  const code = ($('joinCodeInput').value || '').trim();
  if(!name){ $('startStatus').textContent='Ingresá tu nombre'; return; }
  if(code.length !== 4){ $('startStatus').textContent='Código de sala inválido (4 dígitos)'; return; }
  $('startStatus').textContent = 'Buscando sala…';
  setButtonsBusy(true);
  try{
    const roomRef = db.ref('rooms/'+code);
    const snap = await roomRef.get();
    if(!snap.exists()){ $('startStatus').textContent='Sala no encontrada'; return; }
    const room = snap.val();
    const playersCount = room.players ? Object.keys(room.players).length : 0;
    if(room.status !== 'waiting'){ $('startStatus').textContent='La partida ya comenzó'; return; }
    if(playersCount >= MAX_PLAYERS){ $('startStatus').textContent='Sala llena'; return; }

    const usedIndexes = room.players ? Object.values(room.players).map(p=>p.index) : [];
    let idx = 0; while(usedIndexes.includes(idx)) idx++;

    state.playerName = name;
    state.roomCode = code;
    state.isHost = false;
    state.playerIndex = idx;
    state.roomRef = roomRef;

    await roomRef.child('players/'+myId).set({ name, index: idx, color: COLORS[idx], ready:true, joinedAt: Date.now() });
    roomRef.child('players/'+myId).onDisconnect().remove();
    $('startStatus').textContent = '';
    enterLobby();
  } catch(err){
    console.error('Error al unirse a sala:', err);
    $('startStatus').textContent = friendlyFirebaseError(err);
  } finally {
    setButtonsBusy(false);
  }
};

// ---------- LOBBY ----------
function enterLobby(){
  show('lobbyScreen');
  $('roomCodeDisplay').textContent = state.roomCode;
  $('roomCodeDisplay').onclick = () => {
    navigator.clipboard?.writeText(state.roomCode);
    $('copyMsg').textContent = '¡Código copiado!';
    setTimeout(()=> $('copyMsg').textContent='', 1500);
  };
  $('btnStart').classList.toggle('hidden', !state.isHost);

  state.roomRef.on('value', snap => {
    const room = snap.val();
    if(!room){ return; }
    state.players = room.players || {};
    renderLobbyPlayers();

    if(room.status === 'playing' && state.status !== 'playing'){
      state.status = 'playing';
      startGame(room);
    }
    if(!room.players || !room.players[myId]){
      // fui removido o la sala se cerró
    }
  });
}

function renderLobbyPlayers(){
  const grid = $('playersGrid');
  grid.innerHTML = '';
  const list = Object.entries(state.players).sort((a,b)=>a[1].index-b[1].index);
  for(let i=0;i<MAX_PLAYERS;i++){
    const entry = list.find(([,p])=>p.index===i);
    const slot = document.createElement('div');
    slot.className = 'player-slot' + (entry ? ' filled' : '');
    if(entry){
      const [uid,p] = entry;
      slot.innerHTML = `<div class="dot" style="background:${COLORS[i]}"></div>
        <div class="name">${escapeHtml(p.name)}${uid===myId?' (vos)':''}${i===0?' 👑':''}</div>
        <div class="tag">${COLOR_NAMES[i]}</div>`;
    } else {
      slot.innerHTML = `<div class="dot" style="background:#28382f"></div>
        <div class="name">Esperando…</div><div class="tag">Slot ${i+1}</div>`;
    }
    grid.appendChild(slot);
  }
  const count = list.length;
  $('lobbyStatus').textContent = count < 2
    ? 'Esperando al menos 2 jugadores…'
    : (state.isHost ? `${count}/${MAX_PLAYERS} jugadores — podés iniciar cuando quieras` : `${count}/${MAX_PLAYERS} jugadores — esperando al host`);
  if(state.isHost) $('btnStart').classList.toggle('hidden', count < 2);
}

function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

$('btnStart').onclick = async () => {
  if(!state.isHost) return;
  await state.roomRef.update({ status:'playing', startedAt: Date.now() });
};

$('btnLeave').onclick = async () => {
  if(state.roomRef){
    await state.roomRef.child('players/'+myId).remove();
    state.roomRef.off();
  }
  location.reload();
};

$('btnBackToMenu').onclick = () => location.reload();

// =========================================================
// JUEGO
// =========================================================
let canvas, ctx, W, H, GROUND_Y;
let localPlayers = {};   // render state for all players (local interpolation)
let localInput = { left:false, right:false, jump:false, attack:false, fire:false };
let animFrame = null;
let lastTs = 0;
let platforms = [];
let weaponsOnMap = {};   // id -> {x,y,type}
let bullets = [];        // local visual bullets (host authoritative, replicated via DB events light)
let gameRoomRef = null;
let myPlayerIndex = -1;
let winnerIndex = null;

function startGame(room){
  show('gameScreen');
  myPlayerIndex = state.playerIndex;
  gameRoomRef = state.roomRef;
  canvas = $('gameCanvas');
  ctx = canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  platforms = [
    {x:0, y:0.82, w:1, h:0.05},          // suelo principal (fracciones de H/W)
    {x:0.08, y:0.60, w:0.22, h:0.03},
    {x:0.70, y:0.60, w:0.22, h:0.03},
    {x:0.38, y:0.42, w:0.24, h:0.03},
  ];

  // Inicializar players locales desde la sala
  const list = Object.entries(room.players).sort((a,b)=>a[1].index-b[1].index);
  localPlayers = {};
  list.forEach(([uid,p], i) => {
    localPlayers[uid] = makePlayer(p, i);
  });

  setupInputHandlers();

  if(state.isHost){
    // El host simula el mundo y lo publica periódicamente
    state.world = { players: localPlayers, weapons: {}, bulletsOut: [] };
    spawnWeapon();
    gameRoomRef.child('sim').set(null); // limpiar sim previa
    lastTs = performance.now();
    hostLoop();
  } else {
    // El cliente escucha el estado publicado por el host
    gameRoomRef.child('sim').on('value', snap => {
      const sim = snap.val();
      if(!sim) return;
      applyRemoteSim(sim);
    });
  }

  gameRoomRef.child('status').on('value', snap => {
    if(snap.val() === 'ended' && !$('winOverlay').classList.contains('show')){
      // manejado por winner field abajo
    }
  });
  gameRoomRef.child('winner').on('value', snap => {
    const w = snap.val();
    if(w !== null && w !== undefined){
      declareWinner(w);
    }
  });

  renderLoopStart();
}

function makePlayer(p, i){
  return {
    uid:null, name:p.name, index:i, color: COLORS[i],
    x: 0.1 + i*0.2, y: 0.70, vx:0, vy:0,
    onGround:false, facing:1, hp:100, alive:true,
    attackT:0, weapon:null, fireT:0
  };
}

function resizeCanvas(){
  W = canvas.width = canvas.clientWidth * devicePixelRatio;
  H = canvas.height = canvas.clientHeight * devicePixelRatio;
  GROUND_Y = H*0.82;
}

// ---------- INPUT ----------
function setupInputHandlers(){
  window.addEventListener('keydown', e => handleKey(e.code, true));
  window.addEventListener('keyup', e => handleKey(e.code, false));

  bindTouch('tLeft','left'); bindTouch('tRight','right');
  bindTouch('tJump','jump'); bindTouch('tAttack','attack'); bindTouch('tFire','fire');
}
function handleKey(code, down){
  if(['ArrowLeft','KeyA'].includes(code)) localInput.left = down;
  if(['ArrowRight','KeyD'].includes(code)) localInput.right = down;
  if(['ArrowUp','KeyW','Space'].includes(code)) localInput.jump = down;
  if(['KeyJ'].includes(code)) localInput.attack = down;
  if(['KeyK'].includes(code)) localInput.fire = down;
}
function bindTouch(id, key){
  const el = $(id);
  const on = e => { e.preventDefault(); localInput[key]=true; };
  const off = e => { e.preventDefault(); localInput[key]=false; };
  el.addEventListener('touchstart', on); el.addEventListener('touchend', off);
  el.addEventListener('mousedown', on); el.addEventListener('mouseup', off); el.addEventListener('mouseleave', off);
}

// Enviar mi input a la DB (throttled) para que el host lo lea
let lastInputSend = 0;
function pushMyInput(ts){
  if(ts - lastInputSend < 60) return;
  lastInputSend = ts;
  gameRoomRef.child('inputs/'+myId).set({ ...localInput, t: ts });
}

// ---------- HOST: SIMULACIÓN AUTORITATIVA ----------
let inputsCache = {};
function hostLoop(){
  gameRoomRef.child('inputs').on('value', snap => { inputsCache = snap.val() || {}; });

  function step(ts){
    const dt = Math.min(32, ts - lastTs) / 16.67; // normalizado ~1 = 60fps frame
    lastTs = ts;
    pushMyInput(ts);
    simulate(dt);
    publishSim();
    animFrame = requestAnimationFrame(step);
  }
  animFrame = requestAnimationFrame(step);
}

function simulate(dt){
  const players = state.world.players;
  const uids = Object.keys(players);

  uids.forEach(uid => {
    const pl = players[uid];
    if(!pl.alive) return;
    const inp = (uid===myId) ? localInput : (inputsCache[uid] || {});

    const speed = 0.006;
    if(inp.left){ pl.vx = -speed; pl.facing = -1; }
    else if(inp.right){ pl.vx = speed; pl.facing = 1; }
    else { pl.vx *= 0.7; }

    if(inp.jump && pl.onGround){ pl.vy = -0.021; pl.onGround = false; }

    pl.vy += 0.0009 * dt; // gravedad
    pl.x += pl.vx * dt;
    pl.y += pl.vy * dt;
    pl.x = Math.max(0.02, Math.min(0.98, pl.x));

    // colisión con plataformas
    pl.onGround = false;
    for(const plat of platforms){
      const py = plat.y;
      if(pl.y >= py - 0.02 && pl.y <= py + 0.02 && pl.vy >= 0 &&
         pl.x >= plat.x && pl.x <= plat.x+plat.w){
        pl.y = py - 0.001; pl.vy = 0; pl.onGround = true;
      }
    }
    if(pl.y > 1.05){ // cae al vacío -> muere
      pl.hp = 0; pl.alive = false;
    }

    // ataque cuerpo a cuerpo
    pl.attackT = Math.max(0, pl.attackT - dt);
    if(inp.attack && pl.attackT<=0){
      pl.attackT = 22;
      uids.forEach(u2 => {
        if(u2===uid) return;
        const other = players[u2];
        if(!other.alive) return;
        const dx = other.x - pl.x, dy = other.y - pl.y;
        if(Math.abs(dy) < 0.06 && ((pl.facing>0 && dx>0 && dx<0.09) || (pl.facing<0 && dx<0 && dx>-0.09))){
          other.hp -= 8;
          other.vx += pl.facing * 0.01;
          other.vy -= 0.006;
          if(other.hp<=0){ other.hp=0; other.alive=false; }
        }
      });
    }

    // disparo si tiene arma
    pl.fireT = Math.max(0, pl.fireT - dt);
    if(inp.fire && pl.weapon && pl.fireT<=0){
      pl.fireT = 18;
      state.world.bulletsOut.push({ x: pl.x, y: pl.y-0.02, vx: pl.facing*0.028, owner: uid, t:0 });
    }

    // recoger armas
    Object.entries(state.world.weapons).forEach(([wid,w]) => {
      if(!pl.weapon && Math.abs(pl.x-w.x)<0.03 && Math.abs(pl.y-w.y)<0.05){
        pl.weapon = w.type;
        delete state.world.weapons[wid];
      }
    });
  });

  // balas
  state.world.bulletsOut.forEach(b => {
    b.x += b.vx * dt; b.t += dt;
  });
  state.world.bulletsOut = state.world.bulletsOut.filter(b => b.t < 90 && b.x>-0.05 && b.x<1.05);
  state.world.bulletsOut.forEach(b => {
    uids.forEach(uid => {
      const pl = players[uid];
      if(uid===b.owner || !pl.alive) return;
      if(Math.abs(pl.x-b.x)<0.02 && Math.abs(pl.y-b.y)<0.05){
        pl.hp -= 20; pl.vx += Math.sign(b.vx)*0.012;
        if(pl.hp<=0){ pl.hp=0; pl.alive=false; }
        b.t = 999;
      }
    });
  });
  state.world.bulletsOut = state.world.bulletsOut.filter(b=>b.t<900);

  // spawn armas periódicamente
  if(Math.random() < 0.002*dt && Object.keys(state.world.weapons).length < 2){
    spawnWeapon();
  }

  // condición de victoria
  const aliveList = uids.filter(u=>players[u].alive);
  if(aliveList.length === 1 && uids.length > 1 && winnerIndex===null){
    const w = players[aliveList[0]];
    winnerIndex = w.index;
    gameRoomRef.update({ winner: w.index, status:'ended' });
  }
}

function spawnWeapon(){
  const id = 'w'+Math.random().toString(36).slice(2,8);
  state.world.weapons[id] = { x: 0.15+Math.random()*0.7, y: 0.5, type:'gun' };
}

function publishSim(){
  const players = state.world.players;
  const out = {};
  Object.entries(players).forEach(([uid,p]) => {
    out[uid] = { x:p.x, y:p.y, facing:p.facing, hp:p.hp, alive:p.alive, attackT:p.attackT, weapon:p.weapon, index:p.index, name:p.name };
  });
  gameRoomRef.child('sim').set({
    players: out,
    weapons: state.world.weapons,
    bullets: state.world.bulletsOut.map(b=>({x:b.x,y:b.y,vx:b.vx>0?1:-1})),
    ts: Date.now()
  });
}

// ---------- CLIENTE NO-HOST ----------
function applyRemoteSim(sim){
  Object.entries(sim.players || {}).forEach(([uid,p]) => {
    if(!localPlayers[uid]) localPlayers[uid] = makePlayer({name:p.name}, p.index);
    Object.assign(localPlayers[uid], p);
  });
  weaponsOnMap = sim.weapons || {};
  bullets = sim.bullets || [];
}
function nonHostLoop(ts){
  pushMyInput(ts);
  animFrame = requestAnimationFrame(nonHostLoop);
}

// ---------- RENDER ----------
function renderLoopStart(){
  if(!state.isHost){
    lastTs = performance.now();
    animFrame = requestAnimationFrame(nonHostLoop);
  }
  requestAnimationFrame(draw);
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // fondo simple (cielo + siluetas)
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#dff5e6'); grad.addColorStop(1,'#8fd6a8');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

  // plataformas
  ctx.fillStyle = '#1c2b22';
  platforms.forEach(p => {
    ctx.fillRect(p.x*W, p.y*H, p.w*W, p.h*H);
  });

  // armas en el mapa
  const weapons = state.isHost ? state.world.weapons : weaponsOnMap;
  Object.values(weapons || {}).forEach(w => {
    ctx.font = `${0.05*H}px serif`;
    ctx.fillText('🔫', w.x*W - 0.02*W, w.y*H + 0.02*H);
  });

  // balas
  const bulletList = state.isHost ? state.world.bulletsOut : bullets;
  ctx.fillStyle = '#333';
  bulletList.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x*W, b.y*H, 0.004*W, 0, 7);
    ctx.fill();
  });

  // jugadores
  const src = state.isHost ? state.world.players : localPlayers;
  Object.values(src).forEach(p => drawStickman(p));

  updateHUD(src);

  requestAnimationFrame(draw);
}

function drawStickman(p){
  const x = p.x*W, y = p.y*H;
  const scale = 0.10*H;
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(p.facing,1);
  ctx.strokeStyle = p.alive ? p.color : '#555';
  ctx.fillStyle = p.alive ? p.color : '#555';
  ctx.lineWidth = scale*0.09;
  ctx.lineCap = 'round';

  const legSwing = p.attackT>0 ? 0.15 : 0;
  // cabeza
  ctx.beginPath(); ctx.arc(0, -scale*0.85, scale*0.16, 0, Math.PI*2); ctx.fill();
  // torso
  ctx.beginPath(); ctx.moveTo(0,-scale*0.68); ctx.lineTo(0,-scale*0.18); ctx.stroke();
  // brazos
  ctx.beginPath();
  ctx.moveTo(0,-scale*0.55);
  if(p.attackT>0){ ctx.lineTo(scale*0.42,-scale*0.55); }
  else { ctx.lineTo(scale*0.28,-scale*0.32); }
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-scale*0.55); ctx.lineTo(-scale*0.24,-scale*0.30); ctx.stroke();
  // piernas
  ctx.beginPath(); ctx.moveTo(0,-scale*0.18); ctx.lineTo(scale*(0.22+legSwing),scale*0.28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-scale*0.18); ctx.lineTo(-scale*(0.22),scale*0.28); ctx.stroke();

  if(p.weapon){
    ctx.font = `${scale*0.4}px serif`;
    ctx.fillText('🔫', scale*0.25, -scale*0.5);
  }
  ctx.restore();

  // nombre
  ctx.save();
  ctx.fillStyle = '#12261d';
  ctx.font = `bold ${scale*0.16}px Arial`;
  ctx.textAlign = 'center';
  ctx.fillText(p.name, x, y - scale*1.1);
  ctx.restore();
}

function updateHUD(players){
  const hud = $('hud');
  const list = Object.values(players).sort((a,b)=>a.index-b.index);
  hud.innerHTML = list.map(p => `
    <div class="hp-card">
      <div class="nm"><span style="color:${p.color}">${escapeHtml(p.name)}</span><span>${Math.max(0,Math.round(p.hp))}</span></div>
      <div class="hp-bar"><div class="hp-fill" style="width:${Math.max(0,p.hp)}%;background:${p.alive?'':'#555'}"></div></div>
    </div>`).join('');
}

function declareWinner(winnerIdx){
  cancelAnimationFrame(animFrame);
  const players = state.isHost ? state.world.players : localPlayers;
  const w = Object.values(players).find(p=>p.index===winnerIdx);
  $('winText').textContent = w ? `🏆 ¡${w.name} gana la partida!` : '¡Partida terminada!';
  $('winOverlay').classList.add('show');
}
</script>
